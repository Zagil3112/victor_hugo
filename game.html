<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Melimon y el libro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0d0a12; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'VT323', 'Courier New', monospace; color: #f6ead8; -webkit-user-select: none; user-select: none; }
  #wrap { position: relative; --s: 3; }
  #game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .box { background: #1b1424; border: calc(var(--s) * 1px) solid #f3e3c8; box-shadow: 0 0 0 calc(var(--s) * 1px) #1b1424; }
  #dialog { position: absolute; left: 4%; right: 4%; top: 4%; min-height: 26%; display: flex; align-items: flex-start; gap: calc(var(--s) * 5px); padding: calc(var(--s) * 4px) calc(var(--s) * 6px); font-size: calc(var(--s) * 10px); line-height: 1.05; box-sizing: border-box; }
  #dialog.bottom { top: auto; bottom: 4%; }
  #dialog .face { height: calc(var(--s) * 24px); width: calc(var(--s) * 30px); object-fit: contain; image-rendering: pixelated; flex-shrink: 0; background: #2a2036; border: calc(var(--s) * 1px) solid #e8b04c; padding: calc(var(--s) * 1px); }
  #dialog .body { flex: 1; min-width: 0; }
  #dialog .who { color: #e8b04c; font-size: 0.85em; margin-bottom: calc(var(--s) * 1px); }
  #dialog .who:empty { display: none; }
  #dialog .next { position: absolute; right: calc(var(--s) * 5px); bottom: calc(var(--s) * 2px); color: #e8b04c; animation: blink 0.8s steps(2) infinite; }
  #prompt { position: absolute; transform: translate(-50%, -100%); padding: 0 calc(var(--s) * 3px); font-size: calc(var(--s) * 8px); white-space: nowrap; }
  #prompt b { color: #e8b04c; font-weight: normal; }
  #hint img { height: calc(var(--s) * 10px); image-rendering: pixelated; vertical-align: middle; margin: 0 calc(var(--s) * 0.5px); }
  #hint .sep { margin: 0 calc(var(--s) * 2px); opacity: 0.7; }
  #hint { position: absolute; top: 4%; left: 50%; transform: translateX(-50%); padding: 0 calc(var(--s) * 4px); font-size: calc(var(--s) * 7px); white-space: nowrap; transition: opacity 0.6s; }
  #center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: calc(var(--s) * 4px); padding: 0 10%; }
  #center .t { font-size: calc(var(--s) * 16px); color: #e8b04c; }
  #center .st { font-size: calc(var(--s) * 8px); }
  #item { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(13, 10, 18, 0.6); }
  #item .panel { padding: calc(var(--s) * 8px) calc(var(--s) * 14px); display: flex; flex-direction: column; align-items: center; gap: calc(var(--s) * 3px); }
  .rec { position: relative; width: calc(var(--s) * 56px); height: calc(var(--s) * 56px); margin-right: calc(var(--s) * 24px); }
  .sleeve { position: absolute; inset: 0; z-index: 2; background: linear-gradient(135deg, #9b1d33, #5e0f1f); border: calc(var(--s) * 1px) solid #e8b04c; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .sleeve img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: none; }
  .sleeve.has-img img { display: block; }
  .sleeve.has-img .fallback { display: none; }
  .sleeve .fallback { color: #e8b04c; font-size: calc(var(--s) * 22px); }
  .disc { position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; z-index: 1; border-radius: 50%; box-shadow: 0 0 0 calc(var(--s) * 1px) #5a5266; background: radial-gradient(circle, #c4212f 0 15%, #1a1420 16% 18%, #2c2638 19% 21%, #1a1420 22% 38%, #2c2638 39% 41%, #1a1420 42% 66%, #2c2638 67% 69%, #1a1420 70%); }
  #item:not(.hidden) .disc { animation: slideOut 0.9s 0.3s ease-out forwards; }
  @keyframes slideOut { to { transform: translateX(42%) rotate(120deg); } }
  #item .cap { margin: calc(var(--s) * 2px) 0 0; font-size: calc(var(--s) * 10px); }
  #item .sub { margin: 0; font-size: calc(var(--s) * 7px); }
  #item .sub b { color: #e8b04c; font-weight: normal; }
  #inv { position: absolute; top: 4%; right: 3%; width: calc(var(--s) * 14px); height: calc(var(--s) * 14px); padding: calc(var(--s) * 1px); }
  #inv .sleeve { position: relative; width: 100%; height: 100%; border: none; }
  #inv .sleeve .fallback { font-size: calc(var(--s) * 7px); }
  #gramMenu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(13, 10, 18, 0.55); pointer-events: auto; }
  #gramMenu .scroll { width: 68%; height: 92%; display: flex; flex-direction: column; filter: drop-shadow(0 calc(var(--s) * 2px) calc(var(--s) * 4px) rgba(0, 0, 0, 0.5)); }
  #gramMenu .roller { height: calc(var(--s) * 6px); margin: 0 -4%; border-radius: calc(var(--s) * 3px); background: linear-gradient(#8a5a34, #5a3418 55%, #3a200e); box-shadow: inset 0 calc(var(--s) * 1px) 0 rgba(255, 220, 160, 0.35); position: relative; flex-shrink: 0; }
  #gramMenu .roller::before, #gramMenu .roller::after { content: ''; position: absolute; top: -15%; width: calc(var(--s) * 5px); height: 130%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f0d27a, #a8863a 60%, #6a5020); }
  #gramMenu .roller::before { left: calc(var(--s) * -4px); }
  #gramMenu .roller::after { right: calc(var(--s) * -4px); }
  #gramMenu .parch { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: calc(var(--s) * 5px) calc(var(--s) * 10px) calc(var(--s) * 4px); color: #3b2414; font-family: 'IM Fell English', Georgia, 'Times New Roman', serif;
    background: radial-gradient(ellipse at 30% 20%, rgba(255, 250, 230, 0.6), transparent 55%), radial-gradient(ellipse at 75% 85%, rgba(150, 100, 40, 0.18), transparent 50%), linear-gradient(#efdcae, #e6cf98);
    box-shadow: inset 0 0 calc(var(--s) * 10px) rgba(110, 70, 25, 0.55); }
  #gramMenu .orn { font-size: calc(var(--s) * 9px); line-height: 1; color: #7a2a1a; }
  #gramMenu h2 { margin: 0; font-weight: normal; font-size: calc(var(--s) * 11px); letter-spacing: 0.04em; }
  #gramMenu .cols { flex: 1; min-height: 0; width: 100%; display: flex; gap: calc(var(--s) * 6px); margin-top: calc(var(--s) * 3px); }
  #gramMenu .side { width: 38%; display: flex; flex-direction: column; align-items: center; gap: calc(var(--s) * 2px); }
  #gramMenu .cover { position: relative; width: 100%; max-width: calc(var(--s) * 66px); aspect-ratio: 1; background: linear-gradient(135deg, #9b1d33, #5e0f1f); border: calc(var(--s) * 1px) solid #5a3a1e; outline: calc(var(--s) * 0.5px) solid #a8863a; outline-offset: calc(var(--s) * 1px); box-shadow: 0 calc(var(--s) * 1px) calc(var(--s) * 3px) rgba(60, 30, 10, 0.45); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #gramMenu .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #gramMenu .cover.has-img img { display: block; }
  #gramMenu .cover.has-img .fallback { display: none; }
  #gramMenu .cover .fallback { color: #e8b04c; font-size: calc(var(--s) * 20px); }
  #gramMenu .meta { text-align: center; line-height: 1.15; margin-top: calc(var(--s) * 2px); }
  #gramMenu .meta .song { font-size: calc(var(--s) * 7.5px); font-style: italic; }
  #gramMenu .meta .artist { font-size: calc(var(--s) * 6px); color: #7a2a1a; }
  #gramMenu .meta .album { font-size: calc(var(--s) * 5px); color: #6a4a26; }
  #gramMenu .side .bar { width: 100%; flex: none; margin-top: calc(var(--s) * 2px); }
  #gramMenu .player { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: calc(var(--s) * 5.5px); }
  #gramMenu .ink { font-family: inherit; font-size: calc(var(--s) * 6px); color: #3b2414; background: rgba(255, 245, 215, 0.4); border: calc(var(--s) * 0.5px) solid #5a3a1e; border-radius: calc(var(--s) * 1px); padding: calc(var(--s) * 0.5px) calc(var(--s) * 3px); cursor: pointer; white-space: nowrap; }
  #gramMenu .ink:hover, #gramMenu .ink:focus-visible { background: rgba(122, 42, 26, 0.12); outline: none; }
  #gramMenu .bar { height: calc(var(--s) * 3px); position: relative; cursor: pointer; background: linear-gradient(transparent 40%, #8a6a40 40% 60%, transparent 60%); }
  #gramMenu .fill { position: absolute; left: 0; top: 30%; height: 40%; width: 0; background: #3b2414; }
  #gramMenu .fill::after { content: ''; position: absolute; right: calc(var(--s) * -2px); top: 50%; width: calc(var(--s) * 4px); height: calc(var(--s) * 4px); transform: translateY(-50%); border-radius: 50%; background: radial-gradient(circle at 35% 35%, #d8505a, #8e1424); }
  #gramMenu #gmTime { min-width: calc(var(--s) * 30px); text-align: right; }
  #gramMenu .rule { margin: calc(var(--s) * 2px) 0 calc(var(--s) * 1px); color: #7a5a30; font-size: calc(var(--s) * 6px); }
  #gramMenu .lyrics { flex: 1; min-height: 0; overflow-y: auto; border-left: calc(var(--s) * 0.5px) solid rgba(90, 58, 30, 0.35); touch-action: pan-y; text-align: center; font-size: calc(var(--s) * 7px); line-height: 1.35; padding: 0 calc(var(--s) * 4px); box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #8a6a40 transparent;
    -webkit-mask-image: linear-gradient(transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(transparent, #000 8%, #000 92%, transparent); }
  #gramMenu .lyrics p { margin: 0; }
  #gramMenu .lyrics p:first-child { margin-top: calc(var(--s) * 4px); }
  #gramMenu .lyrics p:last-child { margin-bottom: calc(var(--s) * 6px); }
  #gramMenu .memory { margin: calc(var(--s) * 6px) auto calc(var(--s) * 8px); width: 82%; }
  #gramMenu .memory .orn { color: #7a5a30; font-size: calc(var(--s) * 6px); margin-bottom: calc(var(--s) * 3px); }
  #gramMenu .memory img { display: block; width: 100%; height: auto; box-sizing: border-box; background: #fbf5e6; padding: calc(var(--s) * 2px) calc(var(--s) * 2px) calc(var(--s) * 2px); border: calc(var(--s) * 0.5px) solid #a8863a; box-shadow: 0 calc(var(--s) * 1px) calc(var(--s) * 3px) rgba(60, 30, 10, 0.45); transform: rotate(-1.5deg); }
  #gramMenu .memory figcaption { margin-top: calc(var(--s) * 3px); font-style: italic; font-size: calc(var(--s) * 7px); color: #5a2a1a; }
  #gramMenu .lyrics p.gap { height: calc(var(--s) * 5px); }
  #gramMenu .lyrics p.hint { font-style: italic; color: #7a5a30; margin-top: calc(var(--s) * 10px); }
  #gramMenu .foot { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: calc(var(--s) * 2px); }
  #gramMenu .tip { font-size: calc(var(--s) * 5px); font-style: italic; color: #7a5a30; }
  .hidden { display: none !important; }
  .faded { opacity: 0; }
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }
  #touch { position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; padding: 0 16px; pointer-events: none; }
  #touch .grp { display: flex; gap: 12px; }
  #touch button { pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; border: 3px solid #f3e3c8; background: rgba(27, 20, 36, 0.7); color: #f3e3c8; font-family: inherit; font-size: 32px; touch-action: none; }
  #touch button:active { background: rgba(232, 176, 76, 0.5); }
  #rotate { position: fixed; inset: 0; background: #0d0a12; display: none; align-items: center; justify-content: center; text-align: center; font-size: 32px; padding: 24px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  @media (prefers-reduced-motion: reduce) { #dialog .next { animation: none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="320" height="180"></canvas>
  <div id="ui">
    <div id="hint" class="box hidden">Flechas para moverte, <span class="key">Espacio</span> para interactuar</div>
    <div id="prompt" class="box hidden"><b class="key">Espacio</b> <span class="lbl"></span></div>
    <div id="center" class="hidden"><div class="t"></div><div class="st"></div></div>
    <div id="inv" class="box hidden"><div class="sleeve mini"><img alt=""><div class="fallback">♥</div></div></div>
    <div id="item" class="hidden"><div class="panel box">
      <div class="rec"><div class="disc"></div><div class="sleeve"><img alt="Funda del disco"><div class="fallback">♥</div></div></div>
      <p class="cap">¡Has encontrado un disco de vinilo!</p>
      <p class="sub"><b class="key">Espacio</b> para continuar</p>
    </div></div>
    <div id="gramMenu" class="hidden">
      <div class="scroll">
        <div class="roller"></div>
        <div class="parch">
          <div class="orn">❦</div>
          <h2>El Artilugio Canta</h2>
          <div class="cols">
            <div class="side">
              <div class="cover"><img id="gmCover" alt="Portada del álbum"><div class="fallback">♥</div></div>
              <div class="meta">
                <div class="song">Stand Inside Your Love</div>
                <div class="artist">The Smashing Pumpkins</div>
                <div class="album">Machina/The Machines of God</div>
              </div>
              <div class="bar" id="gmBar"><div class="fill" id="gmFill"></div></div>
              <div class="player">
                <button id="gmPlay" class="ink">▶ Tocar</button>
                <span id="gmTime">0:00 / 0:00</span>
              </div>
            </div>
            <div class="lyrics" id="gmLyrics"></div>
          </div>
          <div class="foot"><span class="tip">↑ ↓ para leer · Espacio para pausar</span><button id="gmClose" class="ink">Cerrar</button></div>
        </div>
        <div class="roller"></div>
      </div>
    </div>
    <div id="dialog" class="box hidden"><canvas class="face hidden" width="24" height="20"></canvas><div class="body"><div class="who"></div><div class="text"></div></div><div class="next">▼</div></div>
  </div>
</div>
<div id="touch" class="hidden">
  <div class="grp"><button id="tLeft" aria-label="Izquierda">◀</button><button id="tRight" aria-label="Derecha">▶</button></div>
  <div class="grp"><button id="tAct" aria-label="Interactuar">A</button></div>
</div>
<audio id="song" src="cancion.mp3" preload="auto"></audio>
<script src="letra.js"></script>
<div id="rotate">Gira el teléfono para jugar ↻</div>

<script>
(() => {
'use strict';

/* ================= Configuración base ================= */
const W = 320, H = 180;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const wrap = document.getElementById('wrap');
const isTouch = matchMedia('(pointer: coarse)').matches;
const KEY = isTouch ? 'A' : 'Espacio';
document.querySelectorAll('.key').forEach(el => el.textContent = KEY);
let scale = 3;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  scale = s >= 2 ? Math.floor(s) : s;
  wrap.style.width = (W * scale) + 'px';
  wrap.style.height = (H * scale) + 'px';
  wrap.style.setProperty('--s', scale);
}
addEventListener('resize', resize);
resize();

function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function grid(g, rows, pal, ox, oy, flip, maxRows) {
  const w = rows[0].length;
  const n = maxRows ? Math.min(maxRows, rows.length) : rows.length;
  for (let y = 0; y < n; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const c = row[x];
      if (c === '.' || !pal[c]) continue;
      g.fillStyle = pal[c];
      g.fillRect(ox + (flip ? w - 1 - x : x), oy + y, 1, 1);
    }
  }
}

/* ================= Melimon (24 x 33) ================= */
const MEL_PAL = { K:'#1a1420', H:'#26202f', h:'#3c3a55', o:'#5d6488', S:'#f6dccb', s:'#e2b9a6', B:'#f4a0a6', e:'#140c12', E:'#33431a', g:'#6f8a2a', y:'#a9c25a', W:'#f6fae6', L:'#c4212f', R:'#b3182f', r:'#7c0f22', P:'#2a0c14', G:'#d4ae52', T:'#2c2232' };
const MEL_TOP = [
  "......KKKKKKKKKKKK......",
  "....KKHHHHHHHHHHHHKK....",
  "...KHHHHooHHHHHHHHHHK...",
  "..KHHHooHHHHHHHHHHHHHK..",
  "..KHHoHHHHHHHHHHHHHHHK..",
  ".KHHHHHHHHhHHHHHhHHHHHK.",
  ".KHHHHHHHHHHHHHHHHHHHHK.",
  ".KHHHHHHHHHHHHHHHHHHHHK.",
  ".KHHHhHHHhHHHHhHHHhHHHK.",
  ".KHHHeHHSSHHHHSSHHeHHHK."];
const MEL_OPEN = ["SeeeSSSSSSeeeS","SeEWSSSSSSEWeS","SegESSSSSSgEeS","SSygSSSSSSygSS"];
const MEL_SHUT = ["SSSSSSSSSSSSSS","SSSSSSSSSSSSSS","SeeeSSSSSSeeeS","SSSSSSSSSSSSSS"];
const MEL_LOW = ["SBBSSSLLSSSBBS","HsSSSSSSSSSSsH","HHKsSSSSSSsKHH","HHHHKssssKHHHH"];
const W1L='.KHHH', W2L='KHHoH', W3L='.KHhH', W1R='HHHK.', W2R='HoHHK', W3R='HhHK.';
const MEL_SIDES = [[W1L,W1R],[W2L,W2R],[W2L,W2R],[W3L,W3R],['.KHHG','GHHK.'],['KHHoL','LoHHK'],[W2L,W2R],[W3L,W3R]];
const MEL_BODY = [
  ".KHH"+"KRRHHSSSSSSHHRRK"+"HHK.",
  "KHoH"+"KRRHHSSSSSSHHRRK"+"HoHK",
  ".KHH"+"KRRHHrrrrrrHHRRK"+"HHK.",
  "KH"+"KRRrKHHRPRRPRHHKrRRK"+"HK",
  "KH"+"KRRrKHHRRPRRRHHKrRRK"+"HK",
  ".K"+"KRRrKhHRPRRPRHhKrRRK"+"K.",
  ".KRRRrKRRRRRRRRRRKrRRRK.",
  ".KRPRrKRRPRRRRPRRKrRPRK.",
  ".KrrrrKRRRRRRRRRRKrrrrK.",
  "..KSSKRRPRRRRRRPRRKSSK..",
  "..KKKKRRRRRRRRRRRRKKKK..",
  "....KRPRRRRPRRRRPRRK....",
  "....KrrrrrrrrrrrrrrK...."];
const MEL_FEET = {
  idle: [".......KTTK..KTTK.......","......KKKKK..KKKKK......"],
  w1:   [".......KTTK..KKKKK......","......KKKKK............."],
  w2:   ["......KKKKK..KTTK.......",".............KKKKK......"]
};
function melFrame(feet, blink) {
  const face = (blink ? MEL_SHUT : MEL_OPEN).concat(MEL_LOW);
  const head = face.map((m, i) => MEL_SIDES[i][0] + m + MEL_SIDES[i][1]);
  return MEL_TOP.concat(head, MEL_BODY, MEL_FEET[feet]);
}

/* ================= Gato naranja (16 x 9, durmiendo) ================= */
const CAT_PAL = { k:'#3a2010', O:'#e8892b', o:'#b85f1a', c:'#f6d7a8', p:'#f08a8a', e:'#3a2010' };
const CAT = [
  "..k...k.........",
  ".kOk.kOk........",
  ".kOOkOOOkkkkk...",
  "kOOOOOOOOOOOOk..",
  "kOeOOeOoOOoOOOk.",
  "kOOpOOOOoOOoOOk.",
  "kccOOOOOOOOOOOOk",
  ".kccOOOoOOOoOOOk",
  "..kkkkkkkkkkkkk."];
const CAT_TAIL = [ [[16,6],[17,6],[17,5],[18,4]], [[16,6],[17,6],[18,6],[19,5]] ];
const CAT_X = 52, CAT_Y = 95;

/* ================= Sprites pequeños ================= */
const HEART = ["RR.RR","RRRRR",".RRR.","..R.."];
const ZZZ = ["zzzz","..z.",".z..","zzzz"];

/* ================= Fondo de la habitación (se dibuja una vez) ================= */
const roomBg = document.createElement('canvas');
roomBg.width = W; roomBg.height = H;
(function buildRoom() {
  const g = roomBg.getContext('2d');
  // Pared con motivo
  rect(g, 0, 0, W, 130, '#e8cfc6');
  for (let y = 8, row = 0; y < 98; y += 12, row++) {
    for (let x = row % 2 ? 4 : 10; x < W; x += 12) {
      rect(g, x, y, 1, 1, '#d9b6ad'); rect(g, x - 1, y + 1, 3, 1, '#d9b6ad'); rect(g, x, y + 2, 1, 1, '#d9b6ad');
    }
  }
  // Friso y zócalo
  rect(g, 0, 102, W, 2, '#f3e4dc');
  rect(g, 0, 104, W, 22, '#cf9f95');
  for (let x = 6; x < W; x += 22) { rect(g, x, 107, 1, 16, '#b9877d'); rect(g, x + 1, 107, 1, 16, '#e0b8ae'); }
  rect(g, 0, 126, W, 4, '#6e4630'); rect(g, 0, 126, W, 1, '#8a5a3c');
  // Suelo de madera
  rect(g, 0, 130, W, 50, '#a36d47');
  rect(g, 0, 131, W, 1, '#b57d55');
  [142, 155, 168].forEach((y, i) => {
    rect(g, 0, y, W, 1, '#8a5737');
    for (let x = (i * 37) % 60; x < W; x += 60) rect(g, x, y + 1, 1, 12, '#8a5737');
  });
  rect(g, 0, 130, W, 1, '#5a3820');

  // Alfombra
  for (let y = 147; y <= 167; y++) {
    const d = (y - 157) / 10.5;
    const hw = Math.round(52 * Math.sqrt(Math.max(0, 1 - d * d)));

/* ================= Gramófono: menú de pergamino con reproductor y letra ================= */
const song = document.getElementById('song');
const gm = {
  el: document.getElementById('gramMenu'),
  play: document.getElementById('gmPlay'),
  bar: document.getElementById('gmBar'),
  fill: document.getElementById('gmFill'),
  time: document.getElementById('gmTime'),
  lyrics: document.getElementById('gmLyrics'),
  close: document.getElementById('gmClose'),
  missing: false
};
(function buildLyrics() {
  const text = (typeof window.LETRA === 'string' ? window.LETRA : '').replace(/^\s*\n/, '').replace(/\s+$/, '');
  if (!text) gm.lyrics.innerHTML = '<p class="hint">Añade la letra en el archivo letra.js</p>';
  else text.split('\n').forEach(line => {
    const p = document.createElement('p');
    if (line.trim()) p.textContent = line.trim(); else p.className = 'gap';
    gm.lyrics.appendChild(p);
  });
  const fig = document.createElement('figure');
  fig.className = 'memory';
  fig.innerHTML = '<div class="orn">~ ❦ ~</div><img src="' + PHOTO_SRC + '" alt="Meli y Sebas frente a las murallas de un castillo medieval"><figcaption>Meli y Sebas medievales</figcaption>';
  gm.lyrics.appendChild(fig);
})();
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
function gmRefresh() {
  if (gm.missing) { gm.time.textContent = 'Falta cancion.mp3'; return; }
  gm.play.textContent = song.paused ? '▶ Tocar' : '❚❚ Pausar';
  const pct = song.duration ? (song.currentTime / song.duration) * 100 : 0;
  gm.fill.style.width = pct + '%';
  gm.time.textContent = fmt(song.currentTime) + ' / ' + fmt(song.duration);
}
function gmToggle() {
  if (gm.missing) return;
  if (song.paused) song.play().catch(() => {}); else song.pause();
}
function gmOpenMenu(autoplay) {
  gmOpen = true; hidePrompt();
  gm.el.classList.remove('hidden');
  if (autoplay && song.paused && !gm.missing) song.play().catch(() => {});
  gmRefresh();
}
function gmCloseMenu() { gmOpen = false; gm.el.classList.add('hidden'); manchaScene.state = 'free'; }
song.addEventListener('error', () => { gm.missing = true; gmRefresh(); });
['play', 'pause', 'timeupdate', 'loadedmetadata', 'ended'].forEach(ev => song.addEventListener(ev, gmRefresh));
gm.play.addEventListener('click', gmToggle);
gm.close.addEventListener('click', gmCloseMenu);
gm.bar.addEventListener('pointerdown', e => {
  if (!song.duration) return;
  const r = gm.bar.getBoundingClientRect();
  song.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * song.duration;
});
function gmKey(e) {
  if (e.key === ' ' || e.key === 'Enter') { if (!e.repeat) gmToggle(); }
  else if (e.key === 'ArrowDown') gm.lyrics.scrollBy({ top: 40, behavior: 'smooth' });
  else if (e.key === 'ArrowUp') gm.lyrics.scrollBy({ top: -40, behavior: 'smooth' });
  else if (e.key === 'Escape' || e.key === 'x' || e.key === 'X') gmCloseMenu();
  else return;
  e.preventDefault();
}

const manchaScene = {
  state: 'arrive', camX: 0, placeQ: 0, notesT: 0, hinted: false, chat: 0,
  enter() {
    player.x = 30; player.dir = 1; player.y = GROUND - 33;
    this.state = 'arrive'; this.camX = 0; this.placeQ = 0; this.hinted = false;
    ui2.inv.classList.add('hidden');
    for (let i = 0; i < 6; i++) setTimeout(() => addParticle('star', player.x + 4 + (i * 5) % 18, player.y + 6 + (i * 7) % 20), i * 120);
    setTimeout(() => say([
      { who: 'Melimon', text: '¿Dónde... estoy?' },
      { who: 'Melimon', text: 'Esos molinos... ¿Estoy dentro del libro?' }
    ], () => { this.state = 'meet'; }), 1200);
  },
  talk() {
    if (this.state === 'meet') {
      say([
        { who: 'Don Quijote', text: '¡Deteneos, gentil doncella! Soy Don Quijote de la Mancha, caballero andante.' },
        { who: 'Sancho', text: 'Y yo Sancho Panza, su escudero. Y ese de ahí es Rocinante, el caballo más flaco de Castilla.' },
        { who: 'Don Quijote', text: 'Un sabio encantador nos ha dejado este extraño artilugio, venido de tiempos que aún no existen.', show: 'gramo' },
        { who: 'Sancho', text: 'Mi señor dice que es un arma de gigantes. Yo creo que es una trompeta con manivela.', show: 'gramo' },
        { who: 'Don Quijote', text: 'Dicen que canta, mas le falta el alma: un disco negro como la noche.' },
        { who: 'Sancho', text: 'Lo vi rodar hacia el molino grande, siguiendo el camino.' },
        { who: 'Melimon', text: '¡Yo os lo traigo!' }
      ], () => { this.state = 'search'; });
    } else if (this.state === 'search') {
      say([{ who: 'Sancho', text: 'El molino grande está por allá, siguiendo el camino. ¡No tiene pérdida!' }]);
    } else if (this.state === 'has') {
      say([{ who: 'Don Quijote', text: '¡Lo habéis hallado! Hacednos el honor, doncella: ponedlo vos misma.' }], () => {
        this.placeQ = 0; ui2.inv.classList.add('hidden');
        const covers = player.x + 21 > GX + 4 && player.x + 2 < GX + 28;
        if (covers) { this.state = 'stepping'; this.stepTo = GX + 28; }
        else { player.dir = player.x + 12 < GX + 15 ? 1 : -1; this.state = 'placing'; }
      });
    } else if (this.state === 'free') {
      const lines = [
        [{ who: 'Don Quijote', text: 'Esta melodía es digna de mi señora Dulcinea del Toboso.' }],
        [{ who: 'Sancho', text: 'Si esto es un arma de gigantes, que me ataquen todos los días.' }]
      ];
      say(lines[this.chat++ % lines.length]);
    }
  },
  update(k) {
    if (this.state === 'menu') return;
    const cx = player.x + 12;
    if (this.state === 'item') {
      if (takeAction()) { ui2.item.classList.add('hidden'); this.state = 'has'; ui2.inv.classList.remove('hidden'); }
      return;
    }
    if (this.state === 'stepping') {
      player.moving = true; player.dir = 1; player.walkT += k;
      player.x = Math.min(this.stepTo, player.x + 1.2 * k);
      if (player.x >= this.stepTo) { player.moving = false; player.dir = -1; this.state = 'placing'; }
    }
    if (this.state === 'placing') {
      this.placeQ = Math.min(1, this.placeQ + 0.018 * k);
      if (this.placeQ >= 1) {
        this.state = 'playing';
        setTimeout(() => say([
          { who: 'Don Quijote', text: '¡Por mi señora Dulcinea! ¡El artilugio canta!' },
          { who: 'Sancho', text: 'Pues a mí me suena a gloria bendita.' }
        ], () => { this.state = 'menu'; gmOpenMenu(true); }), 700);
      }
    }
    if (!song.paused) {
      this.notesT += k;
      if (this.notesT > 40) { this.notesT = 0; addParticle('note', GX + 18 + Math.random() * 6, GY + 2); }
    }
    if (!dialog.active && !fading() && ['meet', 'search', 'has', 'free'].includes(this.state)) {
      const maxX = this.state === 'meet' ? QX - 20 : WORLD_W - 24;
      updatePlayer(k, 0, maxX);
      if (this.state === 'meet' && input.right && player.x >= maxX - 0.5 && !this.hinted) {
        this.hinted = true;
        say([{ who: 'Melimon', text: 'Mejor saludo primero a estos señores...' }]);
        return;
      }
      let label = null, act = null;
      if (this.state === 'free' && cx > GX - 8 && cx < GX + 38) { label = 'Escuchar'; act = () => { this.state = 'menu'; gmOpenMenu(false); }; }
      else if (cx > QX - 18 && cx < RX + 20) { label = this.state === 'has' ? 'Poner disco' : 'Hablar'; act = () => this.talk(); }
      else if (this.state === 'search' && Math.abs(cx - (VX + 6)) < 18) {
        label = 'Recoger'; act = () => { this.state = 'item'; hidePrompt(); ui2.item.classList.remove('hidden'); sfx('pickup'); };
      }
      if (label) { showPrompt(label, cx - this.camX, player.y + 46); if (takeAction()) { hidePrompt(); act(); } }
      else { hidePrompt(); takeAction(); }
    } else if (!dialog.active) { hidePrompt(); takeAction(); }
    else hidePrompt();
    const target = Math.max(0, Math.min(WORLD_W - W, cx - W / 2));
    this.camX += (target - this.camX) * Math.min(1, 0.12 * k);
  },
  draw() {
    const cam = Math.round(this.camX);
    const sky = ['#7fbfe8', '#8ec8ea', '#a0d0ea', '#b4d8e6', '#c8dfe0', '#dbe3d6', '#e9e2c6', '#f2dcae'];
    sky.forEach((c, i) => rect(ctx, 0, i * 14, W, 14, c));
    const sunX = 250 - Math.round(cam * 0.05);
    ctx.fillStyle = 'rgba(255, 241, 192, 0.35)'; ctx.beginPath(); ctx.arc(sunX, 32, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff1c0'; ctx.beginPath(); ctx.arc(sunX, 32, 9, 0, Math.PI * 2); ctx.fill();
    [[40, 22, 26], [150, 14, 34], [280, 40, 22], [400, 26, 30]].forEach(([x, y, w]) => {
      const cxl = ((x - cam * 0.08 + t * 0.03) % 480 + 480) % 480 - 80;
      rect(ctx, Math.round(cxl), y, w, 4, '#ffffff'); rect(ctx, Math.round(cxl) + 5, y - 3, w - 12, 3, '#ffffff');
      rect(ctx, Math.round(cxl) + 2, y + 4, w - 4, 1, '#e8eef2');
    });
    const f1 = cam * 0.2;
    for (let x = 0; x < W; x++) {
      const lx = x + f1, h = Math.round(102 + 7 * Math.sin(lx / 41) + 4 * Math.sin(lx / 17));
      rect(ctx, x, h, 1, 130 - h, '#bdb07a'); rect(ctx, x, h, 1, 1, '#cfc28c');
    }
    [70, 150, 240, 330, 430].forEach((wx, i) => {
      const x = Math.round(wx - f1), base = Math.round(102 + 7 * Math.sin(wx / 41) + 4 * Math.sin(wx / 17)) + 2;
      if (x > -30 && x < W + 30) windmill(ctx, x, base, 0.6, t * 0.012 + i);
    });
    const f2 = cam * 0.5;
    for (let x = 0; x < W; x++) {
      const lx = x + f2, h = Math.round(118 + 4 * Math.sin(lx / 55));
      rect(ctx, x, h, 1, 140 - h, '#d9b35a');
      for (let y = h + 3; y < 134; y += 4) rect(ctx, x, y, 1, 1, '#c49a42');
      rect(ctx, x, h, 1, 1, '#e6c574');
    }
    OLIVES.forEach(wx => {
      const x = Math.round(wx - f2);
      if (x < -20 || x > W + 20) return;
      const h = Math.round(118 + 4 * Math.sin(wx / 55));
      rect(ctx, x - 1, h - 4, 2, 6, '#5a4030');
      rect(ctx, x - 6, h - 10, 12, 6, '#6d7a3a'); rect(ctx, x - 4, h - 12, 8, 2, '#6d7a3a'); rect(ctx, x - 5, h - 9, 4, 2, '#8a985a');
    });
    rect(ctx, 0, 132, W, 8, '#a7b35c');
    TUFTS.forEach(o => { const x = o.x - cam; if (x > -4 && x < W) { rect(ctx, x, o.y - 2, 1, 2, '#8a9a48'); rect(ctx, x + 2, o.y - 3, 1, 3, '#8a9a48'); } });
    windmill(ctx, MILL_X - cam, 138, 2.0, t * 0.02);
    rect(ctx, 0, 140, W, 26, '#c9a46a'); rect(ctx, 0, 140, W, 1, '#b08a52'); rect(ctx, 0, 165, W, 1, '#b08a52');
    STONES.forEach(o => { const x = o.x - cam; if (x > -4 && x < W) { rect(ctx, x, o.y, 3, 2, '#a88a5a'); rect(ctx, x, o.y, 2, 1, '#d8bc88'); } });
    rect(ctx, 0, 166, W, 14, '#8aa64a');
    FLOWERS.forEach(o => { const x = o.x - cam; if (x > -3 && x < W) { rect(ctx, x, o.y, 1, 2, '#6a8a3a'); rect(ctx, x - 1, o.y - 1, 3, 1, o.c); } });

    // Rocinante, Quijote, gramófono y Sancho
    const bobQ = Math.floor(t / 40) % 2, bobS = Math.floor(t / 34 + 1) % 2;
    rect(ctx, RX - cam + 14, GROUND - 1, 36, 2, 'rgba(60, 40, 20, 0.25)');
    grid(ctx, ROCINANTE, R_PAL, RX - cam, RY);
    if (Math.floor(t / 90) % 3 === 0) rect(ctx, RX - cam + 51, RY + 32 + (Math.floor(t / 10) % 2), 2, 4, '#3a2418');
    rect(ctx, QX - cam + 7, GROUND - 1, 14, 2, 'rgba(60, 40, 20, 0.25)');
    grid(ctx, QUIJOTE, Q_PAL, QX - cam, QY + bobQ);
    rect(ctx, GX - cam + 2, GROUND - 1, 24, 2, 'rgba(60, 40, 20, 0.25)');
    grid(ctx, GRAMO, GR_PAL, GX - cam, GY);
    if (['playing', 'menu', 'free'].includes(this.state)) {
      const pcx = GX - cam + 14.5, pcy = GY + 25.8;
      for (let y = -2; y <= 2; y++) { const hw = Math.round(6.5 * Math.sqrt(Math.max(0, 1 - (y / 2.4) ** 2))); rect(ctx, Math.round(pcx - hw), Math.round(pcy + y), hw * 2, 1, '#1a1420'); }
      rect(ctx, Math.round(pcx) - 2, Math.round(pcy), 4, 1, '#c4212f'); rect(ctx, Math.round(pcx) - 1, Math.round(pcy) - 1, 2, 1, '#c4212f');
      rect(ctx, Math.round(pcx) - 1, Math.round(pcy), 1, 1, '#d0d6dc');
      if (!song.paused) { const a2 = t / 9; rect(ctx, Math.round(pcx + Math.cos(a2) * 4.5), Math.round(pcy + Math.sin(a2) * 1.5), 1, 1, '#7a7a8a'); }
    }
    rect(ctx, SX - cam + 7, GROUND - 1, 16, 2, 'rgba(60, 40, 20, 0.25)');
    grid(ctx, SANCHO, S_PAL, SX - cam, SY + bobS);
    if (this.state === 'meet') sparkle(QX - cam + 14, QY - 5, 0);

    // El disco en el camino (doble de tamaño)
    if (this.state === 'meet' || this.state === 'search') {
      rect(ctx, VX - cam + 1, GROUND - 1, 10, 2, 'rgba(60, 40, 20, 0.3)');
      grid(ctx, DISC_BIG, DISC_PAL, VX - cam, VY);
      sparkle(VX - cam - 3, VY - 2, 1); sparkle(VX - cam + 14, VY + 3, 2); sparkle(VX - cam + 6, VY - 6, 4);
    }

    drawPlayer(cam);

    if (this.state === 'placing') {
      const q = this.placeQ, e = q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
      const x0 = player.x + 6, y0 = player.y + 12, x1 = GX + 11.5, y1 = GY + 22.8;
      const x = x0 + (x1 - x0) * e, y = y0 + (y1 - y0) * e - Math.sin(Math.PI * e) * 26;
      grid(ctx, q < 0.6 ? DISC_BIG : DISC, DISC_PAL, Math.round(x - cam), Math.round(y));
    }
    drawParticles(cam);

    if (dialog.active && dialog.lines[dialog.i].show === 'gramo') {
      rect(ctx, 0, 0, W, H, 'rgba(13, 10, 18, 0.45)');
      const sc = 2, ox = Math.round(W / 2 - 32), oy = 62;
      const glow = ctx.createRadialGradient(ox + 32, oy + 42, 4, ox + 32, oy + 42, 58);
      glow.addColorStop(0, 'rgba(255, 236, 170, 0.35)'); glow.addColorStop(1, 'rgba(255, 236, 170, 0)');
      ctx.fillStyle = glow; ctx.fillRect(ox - 30, oy - 30, 140, 140);
      GRAMO.forEach((row, y) => [...row].forEach((c, x) => { if (c !== '.' && GR_PAL[c]) rect(ctx, ox + x * sc, oy + y * sc, sc, sc, GR_PAL[c]); }));
      sparkle(ox + 20, oy + 4, 3); sparkle(ox + 66, oy + 30, 4); sparkle(ox + 2, oy + 60, 5);
    }
  }
};
const ui2 = { item: document.getElementById('item'), inv: document.getElementById('inv') };

/* ================= Rostros para los diálogos ================= */
function makeFace(rows, pal, x0, y0, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.slice(y0, y0 + h).forEach((row, y) => [...row.slice(x0, x0 + w)].forEach((ch, x) => { if (ch !== '.' && pal[ch]) rect(g, x, y, 1, 1, pal[ch]); }));
  return c;
}
const FACES = {
  'Melimon': makeFace(melFrame('idle', false), MEL_PAL, 0, 0, 24, 20),
  'Don Quijote': makeFace(QUIJOTE, Q_PAL, 4, 1, 20, 21),
  'Sancho': makeFace(SANCHO, S_PAL, 1, 0, 28, 17),
  'Gato': makeFace(CAT, CAT_PAL, 0, 0, 16, 9)
};
function setFace(who) {
  const f = FACES[who];
  if (!f) { ui.face.classList.add('hidden'); return; }
  ui.face.classList.remove('hidden');
  ui.face.width = f.width; ui.face.height = f.height;
  const g = ui.face.getContext('2d'); g.clearRect(0, 0, f.width, f.height); g.drawImage(f, 0, 0);
}

/* ================= Bucle principal ================= */
let last = performance.now();
function loop(now) {
  const k = Math.max(0, Math.min(3, (now - last) / (1000 / 60)));
  last = now;
  t += k;
  updateFade(k);
  updateParticles(k);
  if (dialog.active) updateDialog(k);
  scene.update(k);
  scene.draw();
  if (fade.a > 0) { ctx.fillStyle = `rgba(${fade.col}, ${fade.a})`; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(loop);
}
function keyIcon(glyph, w) {
  w = w || 11;
  const c = document.createElement('canvas'); c.width = w; c.height = 10;
  const g = c.getContext('2d'), ink = '#1b1424';
  rect(g, 1, 0, w - 2, 1, ink); rect(g, 0, 1, 1, 8, ink); rect(g, w - 1, 1, 1, 8, ink); rect(g, 1, 9, w - 2, 1, ink);
  rect(g, 1, 1, w - 2, 6, '#f3e3c8'); rect(g, 1, 1, w - 2, 1, '#fffaf0'); rect(g, 1, 7, w - 2, 2, '#b9a88a');
  const gw = glyph[0].length, ox = Math.floor((w - gw) / 2);
  glyph.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '#') rect(g, ox + x, 2 + y, 1, 1, ink); }));
  return c.toDataURL();
}
function wordGlyph(word) {
  const rows = ['', '', '', '', ''];
  [...word].forEach((ch, i) => { FONT[ch].forEach((r, y) => { rows[y] += (i ? '.' : '') + r; }); });
  return rows;
}
if (!isTouch) {
  const ARROW_L = ["..#..", ".#...", "#####", ".#...", "..#.."];
  const ARROW_R = ARROW_L.map(r => r.split('').reverse().join(''));
  const img = (src, alt) => `<img src="${src}" alt="${alt}">`;
  const sp = wordGlyph('ESPACIO');
  ui.hint.innerHTML = img(keyIcon(FONT.A), 'A') + img(keyIcon(FONT.D), 'D') + '<span class="sep">/</span>' +
    img(keyIcon(ARROW_L), 'Flecha izquierda') + img(keyIcon(ARROW_R), 'Flecha derecha') + ' moverte<span class="sep">·</span>' +
    img(keyIcon(sp, sp[0].length + 6), 'Espacio') + ' interactuar';
}

// Atajo para probar: index.html?escena=libro o ?escena=mancha
const startAt = new URLSearchParams(location.search).get('escena');
scene = startAt === 'mancha' ? manchaScene : startAt === 'libro' ? deskScene : roomScene;
scene.enter();
requestAnimationFrame(loop);
})();
